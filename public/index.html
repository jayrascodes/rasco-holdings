<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Rasco Holdings · Pipeline</title>
<style>
:root {
  --bg: #0b0d0c; --pane: #111413; --pane-2: #171b19; --line: #232926; --line-hi: #34403a;
  --fg: #e6e9e4; --dim: #9aa39c; --faint: #5f6862; --accent: #7fd1a3; --accent-ink: #06130c;
  --gate: #e9b949; --bad: #f87171; --re: #7cb7f0; --bz: #d6a2e8;
  --gap: 8px; --radius: 6px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f2f4f0; --pane: #ffffff; --pane-2: #f6f8f4; --line: #d9dfd6; --line-hi: #b4beb2;
    --fg: #1b211d; --dim: #56615a; --faint: #7c877f; --accent: #1f7a4d; --accent-ink: #ffffff;
    --gate: #9a6a00; --bad: #b91c1c; --re: #1d5fa8; --bz: #7e3aa0;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
h1, h2, h3, p { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: var(--fg); }
button { background: var(--pane-2); border: 1px solid var(--line-hi); border-radius: var(--radius); padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: not-allowed; }
input, select, textarea { background: var(--pane-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 9px; width: 100%; min-width: 0; }
textarea { min-height: 5em; resize: vertical; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { padding: 0 16px 48px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.brand { font-weight: 700; letter-spacing: .02em; font-size: 16px; }
.brand span { color: var(--dim); font-weight: 400; }
.bar .grow { flex: 1; }
.who { color: var(--dim); font-size: 12px; }
.filters { display: inline-flex; border: 1px solid var(--line-hi); border-radius: var(--radius); overflow: hidden; }
.filters button { border: 0; border-radius: 0; background: transparent; color: var(--dim); padding: 6px 10px; }
.filters button[aria-pressed="true"] { background: var(--pane-2); color: var(--fg); font-weight: 600; }
.hint { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
.hint.err { color: var(--bad); }

.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(210px, 1fr); gap: var(--gap); overflow-x: auto; padding-bottom: 8px; align-items: start; }
.stage { background: var(--pane); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.stage.gated { border-top: 2px solid var(--gate); }
.stage.drop-ok { outline: 2px dashed var(--accent); outline-offset: -2px; }
.stage.drop-no { outline: 2px dashed var(--faint); outline-offset: -2px; opacity: .7; }
.stage-head { padding: 9px 10px; border-bottom: 1px solid var(--line); }
.stage-head strong { display: flex; align-items: baseline; gap: 6px; font-size: 13px; }
.stage-head .n { color: var(--faint); font: 11px var(--mono); }
.stage-head .count { margin-left: auto; color: var(--dim); font: 11px var(--mono); }
.stage-head .lock { color: var(--gate); font-size: 11px; font-weight: 500; }
.stage-head small { display: block; color: var(--dim); font-size: 11px; line-height: 1.35; margin-top: 2px; }
.cards { list-style: none; margin: 0; padding: 8px; display: grid; gap: 8px; min-height: 60px; align-content: start; }
.cards .empty { color: var(--faint); font-size: 12px; padding: 4px 2px; }
.card { background: var(--pane-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 10px; cursor: pointer; overflow-wrap: anywhere; }
.card:hover { border-color: var(--line-hi); }
.card[draggable="true"] { cursor: grab; }
.card.dragging { opacity: .4; }
.card.locked { border-style: dashed; }
.card-top { display: flex; align-items: center; gap: 6px; font: 11px var(--mono); color: var(--dim); }
.chip { border-radius: 99px; padding: 0 7px; border: 1px solid currentColor; font: 10px/16px var(--sans); text-transform: uppercase; letter-spacing: .05em; }
.chip.real_estate { color: var(--re); } .chip.business { color: var(--bz); } .chip.other { color: var(--dim); }
.card strong { display: block; font-size: 14px; line-height: 1.3; margin: 4px 0 3px; }
.card .facts { color: var(--dim); font-size: 12px; }
.card .next { font-size: 12px; margin-top: 5px; }
.card .next b { color: var(--dim); font-weight: 500; }
.card .foot { display: flex; gap: 8px; justify-content: space-between; color: var(--faint); font-size: 11px; margin-top: 6px; }
.badge { font-size: 11px; font-weight: 600; margin-top: 6px; }
.badge.approve { color: var(--accent); } .badge.reject { color: var(--bad); } .badge.wait { color: var(--gate); }

.log { margin-top: 22px; background: var(--pane); border: 1px solid var(--line); border-radius: var(--radius); }
.log summary { padding: 10px 12px; cursor: pointer; font-weight: 600; font-size: 13px; }
.log ul, .hist { list-style: none; margin: 0; padding: 0 12px 10px; font-size: 12px; max-height: 340px; overflow: auto; }
.log li, .hist li { border-top: 1px solid var(--line); padding: 5px 0; overflow-wrap: anywhere; }
.log time, .hist time { color: var(--faint); margin-right: 6px; font: 11px var(--mono); }
.log .actor, .hist .actor { color: var(--accent); }
.log .denied, .hist .denied { color: var(--bad); }

dialog { color: var(--fg); background: var(--pane); border: 1px solid var(--line-hi); padding: 0; }
dialog::backdrop { background: rgb(0 0 0 / .55); }
#detail[open] { position: fixed; inset: 0 0 0 auto; margin: 0; width: min(480px, 100vw); height: 100dvh; max-height: 100dvh; max-width: none; display: flex; flex-direction: column; border-width: 0 0 0 1px; }
#new[open] { width: min(520px, calc(100vw - 24px)); border-radius: var(--radius); }
.d-head { display: flex; align-items: flex-start; gap: 12px; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.d-head h2 { font-size: 17px; line-height: 1.3; }
.d-head .id { font: 12px var(--mono); color: var(--dim); display: block; }
.d-body { padding: 14px 16px 24px; overflow-y: auto; flex: 1; min-height: 0; display: grid; gap: 16px; align-content: start; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form label { display: grid; gap: 3px; font-size: 12px; color: var(--dim); }
.form .wide { grid-column: 1 / -1; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.d-body h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: 6px; }
.gatebox { border: 1px solid var(--gate); border-radius: var(--radius); padding: 12px; display: grid; gap: 8px; }
.notes { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 6px; }
.notes li { background: var(--pane-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 9px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.notes .by { display: block; color: var(--faint); font: 11px var(--mono); }
.decisions { list-style: none; margin: 0; padding: 0; font-size: 13px; display: grid; gap: 4px; }
.hist { padding: 0; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50; max-width: min(560px, calc(100vw - 24px)); background: var(--pane); border: 1px solid var(--accent); border-left-width: 4px; border-radius: var(--radius); padding: 10px 14px; box-shadow: 0 6px 24px rgb(0 0 0 / .35); }
.toast.err { border-color: var(--bad); }
[hidden] { display: none !important; }
@media (max-width: 700px) {
  .board { grid-auto-flow: row; grid-auto-columns: auto; overflow-x: visible; }
  .form { grid-template-columns: 1fr; }
  input, select, textarea { font-size: 16px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand">Rasco Holdings <span>· opportunity pipeline</span></div>
    <div class="filters" role="group" aria-label="Filter by type">
      <button type="button" data-filter="" aria-pressed="true">All</button>
      <button type="button" data-filter="real_estate" aria-pressed="false">Real estate</button>
      <button type="button" data-filter="business" aria-pressed="false">Business</button>
    </div>
    <span class="grow"></span>
    <span class="who" id="who"></span>
    <button type="button" class="primary" id="new-btn" disabled>+ New opportunity</button>
  </header>
  <p class="hint" id="hint">Loading…</p>
  <main class="board" id="board" aria-label="Pipeline board"></main>
  <details class="log" open>
    <summary>Activity log</summary>
    <ul id="log"><li>Loading…</li></ul>
  </details>
</div>

<dialog id="detail" aria-label="Opportunity detail">
  <div class="d-head"><h2><span class="id" id="d-id"></span><span id="d-title"></span></h2><button type="button" id="d-close" aria-label="Close">✕</button></div>
  <div class="d-body" id="d-body"></div>
</dialog>

<dialog id="new" aria-labelledby="new-h">
  <form id="new-form">
    <div class="d-head"><h2 id="new-h">New opportunity</h2><button type="button" id="new-close" aria-label="Close">✕</button></div>
    <div class="d-body">
      <div class="form">
        <label class="wide">Title<input name="title" required maxlength="200" placeholder="12-unit on Elm St"></label>
        <label>Type<select name="type"><option value="real_estate">Real estate</option><option value="business">Business</option><option value="other">Other</option></select></label>
        <label>Location<input name="location" maxlength="200"></label>
        <label>Asking price / terms<input name="ask" maxlength="200"></label>
        <label>Owner<input name="owner" maxlength="100" placeholder="Who is working it"></label>
        <label class="wide">Link<input name="link" type="url" placeholder="https://"></label>
        <label class="wide">Next action<input name="next_action" maxlength="500"></label>
        <label class="wide">First note<textarea name="note" maxlength="4000" placeholder="Where it came from, why it's interesting"></textarea></label>
      </div>
      <div class="row"><button type="submit" class="primary">Add to Sourced</button></div>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TYPE_LABEL = { real_estate: "Real estate", business: "Business", other: "Other" };
const B = { me: null, gate: "", stages: [], cards: [], filter: "" };
const when = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); };
const stageIdx = s => B.stages.findIndex(x => x.name === s);
const gateIdx = () => stageIdx(B.gate);
const isJay = () => !!(B.me && B.me.can_approve);
const canMove = (from, to) => { if (isJay()) return true; const g = gateIdx(), f = stageIdx(from), t = stageIdx(to); return t >= 0 && t < g && f < g; };
const card = id => B.cards.find(c => c.id === id);

let toastT;
function toast(msg, err) { const t = $("#toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, err ? 7000 : 2500); }
async function api(path, method = "GET", body) {
  const r = await fetch("/api" + path, { method, credentials: "same-origin", redirect: "manual", headers: method === "GET" ? {} : { "content-type": "application/json" }, body: method === "GET" ? undefined : JSON.stringify(body || {}) });
  if (r.type === "opaqueredirect" || r.status === 0) throw new Error("Your sign-in expired. Reload the page.");
  let data = null; try { data = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error((r.status === 403 ? "⛔ " : "") + ((data && data.error) || `Request failed (${r.status})`));
  return data;
}
const lastDecision = c => { const a = c.approvals || []; return a.length ? a[a.length - 1] : null; };
function badge(c) {
  const d = lastDecision(c);
  if (c.awaiting_decision) return '<div class="badge wait">Waiting on Jay</div>';
  if (!d) return "";
  return `<div class="badge ${esc(d.decision)}">${d.decision === "approve" ? "Approved" : "Rejected"} ${esc(when(d.created_at))}</div>`;
}
function cardHtml(c) {
  const locked = !isJay() && stageIdx(c.stage) >= gateIdx();
  const facts = [c.location, c.ask].filter(Boolean).map(esc).join(" · ");
  return `<li class="card${locked ? " locked" : ""}" data-id="${esc(c.id)}" tabindex="0" role="button"${locked ? ' title="Only Jay can move cards at or past Jay approval"' : ' draggable="true"'}>
    <div class="card-top"><span>${esc(c.id)}</span><span class="chip ${esc(c.type)}">${esc(TYPE_LABEL[c.type] || c.type)}</span></div>
    <strong>${esc(c.title)}</strong>
    ${facts ? `<div class="facts">${facts}</div>` : ""}
    ${c.next_action ? `<div class="next"><b>Next:</b> ${esc(c.next_action)}</div>` : ""}
    ${badge(c)}
    <div class="foot"><span>${esc(c.owner || "unowned")}</span><span>${esc(when(c.updated_at))}</span></div></li>`;
}
function render() {
  const g = gateIdx();
  $("#board").innerHTML = B.stages.map((st, i) => {
    const cards = B.cards.filter(c => c.stage === st.name && (!B.filter || c.type === B.filter));
    return `<section class="stage${i >= g ? " gated" : ""}" data-stage="${esc(st.name)}" aria-label="${esc(st.name)}">
      <div class="stage-head"><strong><span class="n">${st.n}</span>${esc(st.name)}${i >= g ? '<span class="lock">Jay only</span>' : ""}<span class="count">${cards.length}</span></strong><small>${esc(st.exit_test)}</small></div>
      <ul class="cards">${cards.map(cardHtml).join("") || '<li class="empty">Nothing here</li>'}</ul></section>`;
  }).join("");
}
async function load(force) {
  try {
    Object.assign(B, await api("/board"));
    $("#who").textContent = `${B.me.name}${B.me.type === "bot" ? " (agent)" : ""}`;
    $("#hint").className = "hint";
    $("#hint").textContent = isJay() ? "Drag a card between stages, or open it to edit, add notes and decide." : `Drag a card between stages, or open it to edit and add notes. Only Jay can move cards into or past “${B.gate}”.`;
    $("#new-btn").disabled = false;
    render(); loadLog();
    if (detailId) card(detailId) ? openDetail(detailId, force) : closeDetail();
  } catch (e) { $("#hint").className = "hint err"; $("#hint").textContent = "Couldn't load the board: " + e.message; }
}
function eventHtml(ev, withCard = true) {
  const id = withCard && ev.card_id ? ` <b>${esc(ev.card_id)}</b>` : "";
  const what = ev.action === "move" ? `moved${id} ${esc(ev.from_value || "—")} → ${esc(ev.to_value)}`
    : ev.action === "denied_move" ? `<span class="denied">was blocked moving${id} ${esc(ev.from_value || "—")} → ${esc(ev.to_value)}</span>`
    : ev.action === "create" ? `created${id} (${esc(ev.to_value)})`
    : ev.action === "note" ? `noted${withCard ? " on" + id : ""}: ${esc(ev.to_value)}`
    : ev.action === "decision" ? `${ev.to_value === "approve" ? "approved" : "rejected"}${id}`
    : ev.action === "delete" ? `deleted${id}`
    : ev.action.startsWith("update:") ? `set ${esc(ev.action.slice(7).replace("_", " "))}${withCard ? " on" + id : ""} to “${esc(ev.to_value || "")}”`
    : `${esc(ev.action)} ${esc(ev.to_value || "")}`;
  return `<li><time datetime="${esc(ev.at)}">${esc(when(ev.at))}</time><span class="actor">${esc(ev.actor)}</span> ${what}</li>`;
}
async function loadLog() {
  try { const { events } = await api("/log?limit=80"); $("#log").innerHTML = events.map(e => eventHtml(e)).join("") || "<li>No activity yet.</li>"; }
  catch (e) { $("#log").innerHTML = `<li>Couldn't load the log: ${esc(e.message)}</li>`; }
}
async function act(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); } catch (e) { toast(e.message, true); }
  await load(true);
}
const move = (id, to) => { const c = card(id); if (c && c.stage !== to) act(() => api(`/cards/${encodeURIComponent(id)}/move`, "POST", { stage: to }), `${id} → ${to}`); };

/* ---- detail sheet ---- */
const detail = $("#detail"); let detailId = null;
function closeDetail() { detailId = null; if (detail.open) detail.close(); }
function noteHtml(line) {
  const m = /^\[(\d{4}-\d\d-\d\d) ([^\]]+)\] ([\s\S]*)$/.exec(line);
  return m ? `<li><span class="by">${esc(m[1])} · ${esc(m[2])}</span>${esc(m[3])}</li>` : `<li>${esc(line)}</li>`;
}
// Notes are stored as lines starting "[date actor] "; a note's own line breaks stay with it.
const splitNotes = notes => String(notes || "").split(/\n(?=\[\d{4}-\d\d-\d\d [^\]]+\] )/).filter(s => s.trim());
function openDetail(id, force) {
  const c = card(id); if (!c) return;
  // Don't wipe what someone is typing when the board refreshes behind an open sheet.
  const typing = detail.open && detailId === id && detail.contains(document.activeElement) && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) && document.activeElement.value;
  const same = detail.open && detailId === id;
  detailId = id;
  $("#d-id").textContent = `${c.id} · ${TYPE_LABEL[c.type] || c.type}`; $("#d-title").textContent = c.title;
  if (typing && !force) return;
  const drafts = same ? ["#d-note", "#d-decision-note"].map(s => [s, $(s) && $(s).value]) : [];
  const locked = !isJay() && stageIdx(c.stage) >= gateIdx();
  const f = (name, label, wide) => `<label${wide ? ' class="wide"' : ""}>${label}<input data-field="${name}" value="${esc(c[name])}"></label>`;
  const opts = B.stages.map(s => `<option value="${esc(s.name)}"${s.name === c.stage ? " selected" : ""}${s.name !== c.stage && !canMove(c.stage, s.name) ? " disabled" : ""}>${s.n} · ${esc(s.name)}</option>`).join("");
  const notes = splitNotes(c.notes).reverse();
  const decided = (c.approvals || []).map(a => `<li><span class="badge ${esc(a.decision)}">${a.decision === "approve" ? "Approved" : "Rejected"}</span> ${esc(when(a.created_at))} by ${esc(a.actor)}${a.note ? " — " + esc(a.note) : ""}</li>`).join("");
  const gate = c.awaiting_decision && isJay() ? `<div class="gatebox"><h3>Your decision</h3><textarea id="d-decision-note" placeholder="Optional note: conditions, price ceiling, why not" maxlength="2000"></textarea><div class="row"><button type="button" class="primary" data-decide="approve">Approve</button><button type="button" class="danger" data-decide="reject">Reject</button></div></div>` : "";
  $("#d-body").innerHTML = `
    <div class="form">
      <label class="wide">Stage<select id="d-stage"${locked ? " disabled" : ""}>${opts}</select></label>
      ${f("title", "Title", true)}${f("location", "Location")}${f("ask", "Asking price / terms")}${f("owner", "Owner")}
      <label>Type<select data-field="type">${Object.entries(TYPE_LABEL).map(([k, v]) => `<option value="${k}"${k === c.type ? " selected" : ""}>${v}</option>`).join("")}</select></label>
      ${f("link", "Link", true)}${f("next_action", "Next action", true)}
    </div>
    ${c.link ? `<a href="${esc(c.link)}" target="_blank" rel="noopener noreferrer">Open link ↗</a>` : ""}
    ${gate}
    ${decided ? `<div><h3>Decisions</h3><ul class="decisions">${decided}</ul></div>` : ""}
    <div><h3>Notes</h3>
      <textarea id="d-note" placeholder="Add a note: numbers, findings, the memo" maxlength="4000"></textarea>
      <div class="row" style="margin:8px 0 12px"><button type="button" id="d-note-add">Add note</button></div>
      <ul class="notes">${notes.map(noteHtml).join("") || '<li class="by">No notes yet.</li>'}</ul></div>
    <div><h3>History</h3><ul class="hist" id="d-hist"><li>Loading…</li></ul></div>
    ${c.can_delete ? '<div class="row"><button type="button" class="danger" id="d-delete">Delete card</button></div>' : ""}`;
  for (const [s, v] of drafts) if (v && $(s)) $(s).value = v;
  if (!detail.open) detail.showModal();
  api(`/log?card=${encodeURIComponent(id)}&limit=200`).then(({ events }) => { if (detailId === id) $("#d-hist").innerHTML = events.map(e => eventHtml(e, false)).join("") || "<li>No history.</li>"; }).catch(() => {});
}
$("#d-close").addEventListener("click", closeDetail);
detail.addEventListener("close", () => { detailId = null; });
detail.addEventListener("click", e => {
  if (e.target === detail) return closeDetail();
  const id = detailId; if (!id) return;
  const d = e.target.closest("[data-decide]");
  if (d) { const note = $("#d-decision-note").value; $("#d-decision-note").value = ""; return act(() => api(`/cards/${encodeURIComponent(id)}/decision`, "POST", { decision: d.dataset.decide, note }), `${id} ${d.dataset.decide === "approve" ? "approved" : "rejected"}`); }
  if (e.target.closest("#d-note-add")) { const el = $("#d-note"), text = el.value.trim(); if (!text) return el.focus(); el.value = ""; return act(() => api(`/cards/${encodeURIComponent(id)}/notes`, "POST", { text }), "Note added"); }
  if (e.target.closest("#d-delete") && confirm(`Delete ${id}? It leaves the board; its history is kept.`)) { closeDetail(); return act(() => api(`/cards/${encodeURIComponent(id)}`, "DELETE"), `Deleted ${id}`); }
});
detail.addEventListener("change", e => {
  const id = detailId; if (!id) return;
  if (e.target.id === "d-stage") return move(id, e.target.value);
  const field = e.target.dataset.field;
  if (field) { const value = e.target.value; act(() => api(`/cards/${encodeURIComponent(id)}`, "PATCH", { [field]: value }), "Saved"); }
});

/* ---- board interactions ---- */
const board = $("#board"); let dragId = null;
board.addEventListener("click", e => { const li = e.target.closest(".card"); if (li) openDetail(li.dataset.id); });
board.addEventListener("keydown", e => { const li = e.target.closest(".card"); if (li && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openDetail(li.dataset.id); } });
board.addEventListener("dragstart", e => { const li = e.target.closest('.card[draggable="true"]'); if (!li) return; dragId = li.dataset.id; li.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragId); });
board.addEventListener("dragend", () => { dragId = null; board.querySelectorAll(".dragging,.drop-ok,.drop-no").forEach(n => n.classList.remove("dragging", "drop-ok", "drop-no")); });
board.addEventListener("dragover", e => {
  const st = e.target.closest(".stage"); if (!st || !dragId) return;
  const ok = canMove(card(dragId).stage, st.dataset.stage);
  board.querySelectorAll(".drop-ok,.drop-no").forEach(n => { if (n !== st) n.classList.remove("drop-ok", "drop-no"); });
  st.classList.toggle("drop-ok", ok); st.classList.toggle("drop-no", !ok);
  e.preventDefault(); e.dataTransfer.dropEffect = ok ? "move" : "none";
});
board.addEventListener("drop", e => {
  const st = e.target.closest(".stage"); if (!st || !dragId) return;
  e.preventDefault();
  if (!canMove(card(dragId).stage, st.dataset.stage)) toast(`⛔ Only Jay can move a card into or past “${B.gate}”.`, true); else move(dragId, st.dataset.stage);
});
document.querySelector(".filters").addEventListener("click", e => {
  const b = e.target.closest("[data-filter]"); if (!b) return;
  B.filter = b.dataset.filter; document.querySelectorAll("[data-filter]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); render();
});

/* ---- new opportunity ---- */
const newDlg = $("#new"), newForm = $("#new-form");
$("#new-btn").addEventListener("click", () => { newForm.reset(); newDlg.showModal(); });
$("#new-close").addEventListener("click", () => newDlg.close());
newDlg.addEventListener("click", e => { if (e.target === newDlg) newDlg.close(); });
newForm.addEventListener("submit", async e => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(newForm));
  try { const { card: c } = await api("/cards", "POST", body); newDlg.close(); toast(`Created ${c.id}`); await load(true); }
  catch (err) { toast(err.message, true); }
});

load();
setInterval(() => { if (!document.hidden && !dragId) load(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
