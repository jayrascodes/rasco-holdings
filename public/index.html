<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Rasco Holdings</title>
<link rel="preload" href="/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Archivo"; src: url("/fonts/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
:root {
  /* vellum, sheet, ink, rule; stamp inks for the two decisions; highlighter for what is waiting */
  --paper: #e6ebea; --sheet: #fcfdfc; --ink: #131c2b; --ink-2: #4c5766; --ink-3: #667180; --rule: #c3cdcf;
  --slab: #131c2b; --on-slab: #e6ebea; --on-slab-2: #a9b4c0;
  --approve: #17694a; --reject: #b42318; --wait: #f2c14e; --wait-ink: #2b2000;
  --re: #2a5db0; --bz: #8a5a00; --op: #667180;
  --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0e141d; --sheet: #18212e; --ink: #e3e8ed; --ink-2: #a9b4c0; --ink-3: #8491a0; --rule: #2c3848;
    --slab: #22304a; --on-slab: #eef2f5; --on-slab-2: #b4c0cf;
    --approve: #57c596; --reject: #ff8a7a; --re: #86b3ff; --bz: #e0b25a; --op: #8491a0;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 14px/1.45 var(--font); font-variant-numeric: tabular-nums; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
a { color: inherit; text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--re); outline-offset: 2px; }
[hidden] { display: none !important; }

.btn { background: transparent; border: 1px solid var(--ink); border-radius: 3px; padding: 7px 14px; font-weight: 600; cursor: pointer; }
.btn:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-solid { background: var(--ink); color: var(--paper); }
.btn-solid:hover { background: color-mix(in srgb, var(--ink) 85%, var(--paper)); }
.btn-approve { background: var(--approve); border-color: var(--approve); color: #fff; }
.btn-approve:hover { background: color-mix(in srgb, var(--approve) 85%, #000); }
.btn-reject { border-color: currentColor; color: var(--on-slab); }
.btn-quiet { border-color: transparent; color: var(--ink-2); font-weight: 500; padding-inline: 6px; }
.btn-quiet.danger { color: var(--reject); }

.wrap { padding: 0 20px 56px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 18px 0 0; }
.wordmark { font-stretch: 125%; font-weight: 800; font-size: 15px; letter-spacing: .01em; }
.top .grow { flex: 1; }
.who { color: var(--ink-2); font-size: 13px; }
.filters { display: inline-flex; gap: 2px; }
.filters button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 5px 8px; color: var(--ink-2); cursor: pointer; }
.filters button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); font-weight: 600; }

.status { padding: 26px 0 22px; max-width: 60ch; }
.status h1 { font-stretch: 112%; font-weight: 700; font-size: clamp(24px, 3.2vw, 38px); line-height: 1.1; letter-spacing: -.015em; }
.status p { color: var(--ink-2); margin-top: 8px; font-size: 15px; }
.status.err h1 { color: var(--reject); }

.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(172px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 10px; align-items: start; }
.stage { min-width: 0; border-top: 2px solid var(--ink); border-radius: 0 0 4px 4px; }
.stage-head { padding: 8px 2px 10px; }
.stage-head h2 { display: flex; align-items: baseline; gap: 7px; font-stretch: 78%; font-weight: 700; font-size: 17px; line-height: 1.2; }
.stage-head .n { color: var(--ink-3); font-weight: 400; }
.stage-head .count { margin-left: auto; font-weight: 500; color: var(--ink-2); font-size: 14px; }
.stage-head p { color: var(--ink-2); font-size: 12px; line-height: 1.35; margin-top: 3px; }
.cards { display: grid; gap: 8px; min-height: 72px; align-content: start; padding-bottom: 8px; }
.stage.drop-ok { outline: 2px dashed var(--re); outline-offset: 3px; }
.stage.drop-no { opacity: .45; }
/* The gate is the one place the board changes colour: nothing passes it without Jay. */
.stage.gate { background: var(--slab); color: var(--on-slab); border-top-color: var(--slab); border-radius: 4px; padding: 0 8px; }
.stage.gate .stage-head { padding-inline: 2px; }
.stage.gate .stage-head .n, .stage.gate .stage-head .count, .stage.gate .stage-head p { color: var(--on-slab-2); }
.stage.after { border-top-style: double; border-top-width: 4px; }

.card { position: relative; background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-left: 3px solid var(--op); border-radius: 3px; padding: 9px 10px 8px; cursor: pointer; overflow-wrap: anywhere; }
.card.real_estate { border-left-color: var(--re); } .card.business { border-left-color: var(--bz); }
.card:hover { border-color: var(--ink-3); border-left-color: var(--op); }
.card.real_estate:hover { border-left-color: var(--re); } .card.business:hover { border-left-color: var(--bz); }
.card[draggable="true"] { cursor: grab; }
.card.dragging { opacity: .35; }
.card-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-3); }
.card-top .type { font-weight: 600; }
.real_estate .type { color: var(--re); } .business .type { color: var(--bz); }
.card h3 { font-size: 15px; font-weight: 650; line-height: 1.25; margin: 3px 0 2px; }
.card .place { color: var(--ink-2); font-size: 13px; }
.card .ask { font-weight: 600; font-size: 14px; margin-top: 1px; }
.card .next { font-size: 13px; margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--rule); }
.card .next span { color: var(--ink-3); }
.card-foot { display: flex; justify-content: space-between; gap: 8px; color: var(--ink-3); font-size: 12px; margin-top: 7px; }
.waiting { display: inline-block; background: var(--wait); color: var(--wait-ink); font-weight: 700; font-size: 12px; padding: 1px 7px; border-radius: 2px; margin-top: 8px; }
/* Rubber stamp: the decision, inked onto the card. Capitals are the stamp's own lettering. */
.stamp { display: inline-block; margin: 9px 0 2px 2px; padding: 2px 9px 1px; border: 2px solid currentColor; outline: 1px solid currentColor; outline-offset: 2px; border-radius: 3px; font-stretch: 70%; font-weight: 800; font-size: 14px; letter-spacing: .09em; text-transform: uppercase; transform: rotate(-3deg); opacity: .92; }
.stamp small { font-weight: 600; font-size: 11px; letter-spacing: .04em; margin-left: 6px; }
.stamp.approve { color: var(--approve); } .stamp.reject { color: var(--reject); transform: rotate(2.5deg); }
.stamp.fresh { animation: stamp .32s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes stamp { from { transform: rotate(-11deg) scale(2.1); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .stamp.fresh { animation: none; } }

.log { margin-top: 34px; border-top: 1px solid var(--rule); max-width: 78ch; }
.log summary { padding: 12px 0 8px; cursor: pointer; font-stretch: 78%; font-weight: 700; font-size: 17px; }
.events { font-size: 13px; max-height: 360px; overflow: auto; }
.events li { display: grid; grid-template-columns: 9ch minmax(0, 1fr); gap: 10px; padding: 5px 0; border-top: 1px solid var(--rule); overflow-wrap: anywhere; }
.events time { color: var(--ink-3); }
.events .actor { font-weight: 600; }
.events .denied { color: var(--reject); }

dialog { color: var(--ink); background: var(--paper); border: 0; padding: 0; }
dialog::backdrop { background: rgb(8 12 20 / .5); }
#detail[open] { position: fixed; inset: 0 0 0 auto; margin: 0; width: min(500px, 100vw); height: 100dvh; max-height: 100dvh; max-width: none; display: flex; flex-direction: column; border-left: 2px solid var(--ink); }
#new[open] { width: min(540px, calc(100vw - 24px)); border: 2px solid var(--ink); border-radius: 4px; }
.d-head { display: flex; align-items: flex-start; gap: 12px; justify-content: space-between; padding: 18px 20px 14px; }
.d-head h2 { font-stretch: 105%; font-weight: 700; font-size: 22px; line-height: 1.15; letter-spacing: -.01em; }
.d-head .id { display: block; font-stretch: 100%; font-weight: 500; font-size: 13px; color: var(--ink-2); letter-spacing: 0; margin-bottom: 4px; }
.d-body { padding: 4px 20px 28px; overflow-y: auto; flex: 1; min-height: 0; display: grid; gap: 22px; align-content: start; }
.d-body h3 { font-stretch: 78%; font-weight: 700; font-size: 16px; margin-bottom: 8px; }
/* Ledger lines: fields are ruled, not boxed. */
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.form label { display: grid; gap: 1px; font-size: 12px; color: var(--ink-2); }
.form .wide { grid-column: 1 / -1; }
.form input, .form select { background: transparent; border: 0; border-bottom: 1px solid var(--ink-3); border-radius: 0; padding: 4px 0 5px; font-size: 15px; color: var(--ink); width: 100%; min-width: 0; }
.form input:hover, .form select:hover { border-bottom-color: var(--ink); }
.form input:focus-visible, .form select:focus-visible { outline: 0; border-bottom: 2px solid var(--re); padding-bottom: 4px; }
.form option { background: var(--sheet); color: var(--ink); }
textarea { background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; padding: 8px 10px; width: 100%; min-height: 5.2em; resize: vertical; font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.decide { background: var(--slab); color: var(--on-slab); border-radius: 4px; padding: 14px; display: grid; gap: 10px; }
.decide h3 { margin: 0; }
.decide p { color: var(--on-slab-2); font-size: 13px; }
.decisions { display: grid; gap: 10px; }
.decisions li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center; font-size: 13px; color: var(--ink-2); }
.decisions .stamp { margin: 4px 2px; }
.decisions q { grid-column: 1 / -1; quotes: none; color: var(--ink); font-size: 14px; }
.notes { display: grid; gap: 0; margin-top: 12px; }
.notes li { display: grid; grid-template-columns: 11ch minmax(0, 1fr); gap: 12px; padding: 9px 0; border-top: 1px solid var(--rule); font-size: 14px; }
.notes .by { color: var(--ink-3); font-size: 12px; line-height: 1.35; padding-top: 2px; }
.notes .text { white-space: pre-wrap; overflow-wrap: anywhere; }
.notes .none { grid-template-columns: 1fr; color: var(--ink-2); }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 50; max-width: min(560px, calc(100vw - 24px)); background: var(--ink); color: var(--paper); border-radius: 3px; padding: 9px 16px; font-weight: 500; }
.toast.err { background: var(--reject); color: #fff; }
@media (prefers-color-scheme: dark) { .toast.err { color: #1a0502; } .btn-approve { color: #04140c; } }
@media (max-width: 760px) {
  .wrap { padding-inline: 16px; }
  .board { grid-auto-flow: row; grid-auto-columns: auto; overflow-x: visible; gap: 18px; }
  .cards { min-height: 0; }
  /* On a phone the stages stack, so the one that needs Jay goes to the top. */
  .stage.gate { padding-bottom: 4px; order: -1; }
  .form { grid-template-columns: 1fr; }
  .form input, .form select, textarea { font-size: 16px; }
  .events li, .notes li { grid-template-columns: 1fr; gap: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="wordmark">Rasco Holdings</div>
    <div class="filters" role="group" aria-label="Show">
      <button type="button" data-filter="" aria-pressed="true">Everything</button>
      <button type="button" data-filter="real_estate" aria-pressed="false">Real estate</button>
      <button type="button" data-filter="business" aria-pressed="false">Business</button>
    </div>
    <span class="grow"></span>
    <span class="who" id="who"></span>
    <button type="button" class="btn btn-solid" id="new-btn" disabled>Add opportunity</button>
  </header>
  <section class="status" id="status" aria-live="polite"><h1 id="status-h">Loading the board</h1><p id="status-p"></p></section>
  <main class="board" id="board" aria-label="Pipeline"></main>
  <details class="log" open>
    <summary>Activity</summary>
    <ul class="events" id="log"></ul>
  </details>
</div>

<dialog id="detail" aria-label="Opportunity">
  <div class="d-head"><h2><span class="id" id="d-id"></span><span id="d-title"></span></h2><button type="button" class="btn btn-quiet" id="d-close">Close</button></div>
  <div class="d-body" id="d-body"></div>
</dialog>

<dialog id="new" aria-labelledby="new-h">
  <form id="new-form">
    <div class="d-head"><h2 id="new-h">Add an opportunity</h2><button type="button" class="btn btn-quiet" id="new-close">Cancel</button></div>
    <div class="d-body">
      <div class="form">
        <label class="wide">Name<input name="title" required maxlength="200" placeholder="12-unit on Elm St"></label>
        <label>Type<select name="type"><option value="real_estate">Real estate</option><option value="business">Business</option><option value="other">Other</option></select></label>
        <label>Location<input name="location" maxlength="200"></label>
        <label>Asking price or terms<input name="ask" maxlength="200"></label>
        <label>Who is working it<input name="owner" maxlength="100"></label>
        <label class="wide">Link to the listing or data room<input name="link" type="url" placeholder="https://"></label>
        <label class="wide">Next action<input name="next_action" maxlength="500"></label>
      </div>
      <textarea name="note" maxlength="4000" aria-label="First note" placeholder="First note: where it came from, why it is worth a look"></textarea>
      <div class="row"><button type="submit" class="btn btn-solid">Add to Sourced</button></div>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TYPE_LABEL = { real_estate: "Real estate", business: "Business", other: "Other" };
const B = { me: null, gate: "", stages: [], cards: [], filter: "" };
const when = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); };
const stageIdx = s => B.stages.findIndex(x => x.name === s);
const gateIdx = () => stageIdx(B.gate);
const isJay = () => !!(B.me && B.me.can_approve);
const canMove = (from, to) => { if (isJay()) return true; const g = gateIdx(), f = stageIdx(from), t = stageIdx(to); return t >= 0 && t < g && f < g; };
const card = id => B.cards.find(c => c.id === id);

let toastT;
function toast(msg, err) { const t = $("#toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, err ? 7000 : 2500); }
async function api(path, method = "GET", body) {
  const r = await fetch("/api" + path, { method, credentials: "same-origin", redirect: "manual", headers: method === "GET" ? {} : { "content-type": "application/json" }, body: method === "GET" ? undefined : JSON.stringify(body || {}) });
  if (r.type === "opaqueredirect" || r.status === 0) throw new Error("Your sign-in expired. Reload the page.");
  let data = null; try { data = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error(((data && data.error) || `Request failed (${r.status})`));
  return data;
}
const lastDecision = c => { const a = c.approvals || []; return a.length ? a[a.length - 1] : null; };
const day = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString([], { day: "numeric", month: "short" }); };
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return isNaN(m) ? "" : m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} hr ago` : m < 10080 ? `${Math.round(m / 1440)} d ago` : day(iso);
}
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
let freshStamp = null; // card whose stamp was just inked, so it lands once
function stampHtml(a, fresh) {
  return `<span class="stamp ${esc(a.decision)}${fresh ? " fresh" : ""}">${a.decision === "approve" ? "Approved" : "Rejected"}<small>${esc(day(a.created_at))}</small></span>`;
}
function cardHtml(c) {
  const locked = !isJay() && stageIdx(c.stage) >= gateIdx();
  const d = lastDecision(c);
  const mark = c.awaiting_decision ? `<span class="waiting">${isJay() ? "Needs your decision" : "Waiting on Jay"}</span>` : d ? stampHtml(d, freshStamp === c.id) : "";
  return `<li class="card ${esc(c.type)}" data-id="${esc(c.id)}" tabindex="0" role="button"${locked ? ' title="Only Jay can move this card now"' : ' draggable="true"'}>
    <div class="card-top"><span class="type">${esc(TYPE_LABEL[c.type] || c.type)}</span><span>${esc(c.id)}</span></div>
    <h3>${esc(c.title)}</h3>
    ${c.location ? `<div class="place">${esc(c.location)}</div>` : ""}
    ${c.ask ? `<div class="ask">${esc(c.ask)}</div>` : ""}
    ${mark ? `<div>${mark}</div>` : ""}
    ${c.next_action ? `<div class="next"><span>Next</span> ${esc(c.next_action)}</div>` : ""}
    <div class="card-foot"><span>${esc(c.owner || "No owner")}</span><span>${esc(ago(c.updated_at))}</span></div></li>`;
}
function renderStatus() {
  const g = gateIdx(), waiting = B.cards.filter(c => c.awaiting_decision).length;
  const before = B.cards.filter(c => stageIdx(c.stage) < g).length, after = B.cards.filter(c => stageIdx(c.stage) > g).length;
  $("#status").className = "status";
  $("#status-h").textContent = isJay()
    ? (waiting ? `${plural(waiting, "opportunity needs", "opportunities need")} your decision.` : "Nothing needs your decision.")
    : (waiting ? `${plural(waiting, "opportunity is", "opportunities are")} waiting on Jay.` : "Nothing is waiting on Jay.");
  $("#status-p").textContent = !B.cards.length ? "The pipeline is empty. Add the first opportunity to start it."
    : `${before} being worked up, ${after} past approval.` + (isJay() ? "" : ` You can move cards as far as ${B.stages[g - 1].name}.`);
}
function render() {
  const g = gateIdx();
  $("#board").innerHTML = B.stages.map((st, i) => {
    const cards = B.cards.filter(c => c.stage === st.name && (!B.filter || c.type === B.filter));
    return `<section class="stage${i === g ? " gate" : i > g ? " after" : ""}" data-stage="${esc(st.name)}" aria-label="${esc(st.name)}">
      <div class="stage-head"><h2><span class="n">${st.n}</span>${esc(st.name)}<span class="count">${cards.length || ""}</span></h2><p>${esc(st.exit_test)}</p></div>
      <ul class="cards">${cards.map(cardHtml).join("")}</ul></section>`;
  }).join("");
  renderStatus();
  freshStamp = null;
}
async function load(force) {
  try {
    Object.assign(B, await api("/board"));
    $("#who").textContent = `${B.me.name}${B.me.type === "bot" ? " (agent)" : ""}`;
    $("#new-btn").disabled = false;
    render(); loadLog();
    if (detailId) card(detailId) ? openDetail(detailId, force) : closeDetail();
  } catch (e) { $("#status").className = "status err"; $("#status-h").textContent = "The board did not load."; $("#status-p").textContent = e.message; }
}
function eventHtml(ev, withCard = true) {
  const id = withCard && ev.card_id ? ` <b>${esc(ev.card_id)}</b>` : "";
  const what = ev.action === "move" ? `moved${id} from ${esc(ev.from_value || "nowhere")} to ${esc(ev.to_value)}`
    : ev.action === "denied_move" ? `<span class="denied">was stopped moving${id} from ${esc(ev.from_value || "nowhere")} to ${esc(ev.to_value)}</span>`
    : ev.action === "create" ? `added${id}${withCard ? ", " + esc(String(ev.to_value).replace(/ @ .*$/, "")) : ""}`
    : ev.action === "note" ? `noted${withCard ? " on" + id : ""}: ${esc(ev.to_value)}`
    : ev.action === "decision" ? `${ev.to_value === "approve" ? "approved" : "rejected"}${id}`
    : ev.action === "delete" ? `deleted${id}`
    : ev.action.startsWith("update:") ? `set ${esc(ev.action.slice(7).replace("_", " "))}${withCard ? " on" + id : ""} to “${esc(ev.to_value || "")}”`
    : `${esc(ev.action)} ${esc(ev.to_value || "")}`;
  return `<li><time datetime="${esc(ev.at)}" title="${esc(when(ev.at))}">${esc(ago(ev.at))}</time><span><span class="actor">${esc(ev.actor)}</span> ${what}</span></li>`;
}
async function loadLog() {
  try { const { events } = await api("/log?limit=80"); $("#log").innerHTML = events.map(e => eventHtml(e)).join("") || "<li><time></time><span>Nothing has happened yet.</span></li>"; }
  catch (e) { $("#log").innerHTML = `<li><time></time><span>The activity list did not load: ${esc(e.message)}</span></li>`; }
}
async function act(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); } catch (e) { toast(e.message, true); }
  await load(true);
}
const move = (id, to) => { const c = card(id); if (c && c.stage !== to) act(() => api(`/cards/${encodeURIComponent(id)}/move`, "POST", { stage: to }), `${id} moved to ${to}`); };

/* ---- detail sheet ---- */
const detail = $("#detail"); let detailId = null;
function closeDetail() { detailId = null; if (detail.open) detail.close(); }
function noteHtml(line) {
  const m = /^\[(\d{4}-\d\d-\d\d) ([^\]]+)\] ([\s\S]*)$/.exec(line);
  return m ? `<li><span class="by">${esc(day(m[1] + "T12:00:00"))}<br>${esc(m[2])}</span><span class="text">${esc(m[3])}</span></li>` : `<li><span class="by"></span><span class="text">${esc(line)}</span></li>`;
}
// Notes are stored as lines starting "[date actor] "; a note's own line breaks stay with it.
const splitNotes = notes => String(notes || "").split(/\n(?=\[\d{4}-\d\d-\d\d [^\]]+\] )/).filter(s => s.trim());
function openDetail(id, force) {
  const c = card(id); if (!c) return;
  // Don't wipe what someone is typing when the board refreshes behind an open sheet.
  const typing = detail.open && detailId === id && detail.contains(document.activeElement) && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) && document.activeElement.value;
  const same = detail.open && detailId === id;
  detailId = id;
  $("#d-id").textContent = `${TYPE_LABEL[c.type] || c.type}, ${c.id}`; $("#d-title").textContent = c.title;
  if (typing && !force) return;
  const drafts = same ? ["#d-note", "#d-decision-note"].map(s => [s, $(s) && $(s).value]) : [];
  const locked = !isJay() && stageIdx(c.stage) >= gateIdx();
  const f = (name, label, wide) => `<label${wide ? ' class="wide"' : ""}>${label}<input data-field="${name}" value="${esc(c[name])}"></label>`;
  const opts = B.stages.map(s => `<option value="${esc(s.name)}"${s.name === c.stage ? " selected" : ""}${s.name !== c.stage && !canMove(c.stage, s.name) ? " disabled" : ""}>${s.n}. ${esc(s.name)}</option>`).join("");
  const notes = splitNotes(c.notes).reverse();
  const fresh = freshStampDetail === id; freshStampDetail = null;
  const all = c.approvals || [];
  const decided = all.map((a, i) => `<li>${stampHtml(a, fresh && i === all.length - 1)}<span>${esc(when(a.created_at))}, ${esc(a.actor)}</span>${a.note ? `<q>${esc(a.note)}</q>` : ""}</li>`).reverse().join("");
  const gate = c.awaiting_decision && isJay() ? `<div class="decide"><h3>Your decision</h3><p>This is recorded once and stays on the card. Move the card yourself afterwards.</p><textarea id="d-decision-note" aria-label="Decision note" placeholder="Conditions, price ceiling, or why not (optional)" maxlength="2000"></textarea><div class="row"><button type="button" class="btn btn-approve" data-decide="approve">Approve</button><button type="button" class="btn btn-reject" data-decide="reject">Reject</button></div></div>` : "";
  $("#d-body").innerHTML = `
    ${gate}
    ${decided ? `<ul class="decisions">${decided}</ul>` : ""}
    <div class="form">
      <label class="wide">Stage<select id="d-stage"${locked ? " disabled" : ""}>${opts}</select></label>
      ${f("title", "Name", true)}${f("location", "Location")}${f("ask", "Asking price or terms")}${f("owner", "Who is working it")}
      <label>Type<select data-field="type">${Object.entries(TYPE_LABEL).map(([k, v]) => `<option value="${k}"${k === c.type ? " selected" : ""}>${v}</option>`).join("")}</select></label>
      ${f("next_action", "Next action", true)}${f("link", "Link to the listing or data room", true)}
    </div>
    ${c.link ? `<a href="${esc(c.link)}" target="_blank" rel="noopener noreferrer">Open the link in a new tab</a>` : ""}
    <div><h3>Notes</h3>
      <textarea id="d-note" aria-label="New note" placeholder="Numbers, findings, the memo" maxlength="4000"></textarea>
      <div class="row" style="margin-top:8px"><button type="button" class="btn" id="d-note-add">Add note</button></div>
      <ul class="notes">${notes.map(noteHtml).join("") || '<li class="none">No notes yet. The first one usually says where this came from.</li>'}</ul></div>
    <div><h3>History</h3><ul class="events" id="d-hist"></ul></div>
    ${c.can_delete ? '<div class="row"><button type="button" class="btn btn-quiet danger" id="d-delete">Delete this card</button></div>' : ""}`;
  for (const [s, v] of drafts) if (v && $(s)) $(s).value = v;
  if (!detail.open) detail.showModal();
  api(`/log?card=${encodeURIComponent(id)}&limit=200`).then(({ events }) => { if (detailId === id) $("#d-hist").innerHTML = events.map(e => eventHtml(e, false)).join(""); }).catch(() => {});
}
let freshStampDetail = null;
$("#d-close").addEventListener("click", closeDetail);
detail.addEventListener("close", () => { detailId = null; });
detail.addEventListener("click", e => {
  if (e.target === detail) return closeDetail();
  const id = detailId; if (!id) return;
  const d = e.target.closest("[data-decide]");
  if (d) { const note = $("#d-decision-note").value; $("#d-decision-note").value = ""; freshStamp = freshStampDetail = id; return act(() => api(`/cards/${encodeURIComponent(id)}/decision`, "POST", { decision: d.dataset.decide, note }), `${id} ${d.dataset.decide === "approve" ? "approved" : "rejected"}`); }
  if (e.target.closest("#d-note-add")) { const el = $("#d-note"), text = el.value.trim(); if (!text) return el.focus(); el.value = ""; return act(() => api(`/cards/${encodeURIComponent(id)}/notes`, "POST", { text }), "Note added"); }
  if (e.target.closest("#d-delete") && confirm(`Delete ${id}? It leaves the board. Its history is kept.`)) { closeDetail(); return act(() => api(`/cards/${encodeURIComponent(id)}`, "DELETE"), `Deleted ${id}`); }
});
detail.addEventListener("change", e => {
  const id = detailId; if (!id) return;
  if (e.target.id === "d-stage") return move(id, e.target.value);
  const field = e.target.dataset.field;
  if (field) { const value = e.target.value; act(() => api(`/cards/${encodeURIComponent(id)}`, "PATCH", { [field]: value }), "Saved"); }
});

/* ---- board interactions ---- */
const board = $("#board"); let dragId = null;
board.addEventListener("click", e => { const li = e.target.closest(".card"); if (li) openDetail(li.dataset.id); });
board.addEventListener("keydown", e => { const li = e.target.closest(".card"); if (li && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openDetail(li.dataset.id); } });
board.addEventListener("dragstart", e => { const li = e.target.closest('.card[draggable="true"]'); if (!li) return; dragId = li.dataset.id; li.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragId); });
board.addEventListener("dragend", () => { dragId = null; board.querySelectorAll(".dragging,.drop-ok,.drop-no").forEach(n => n.classList.remove("dragging", "drop-ok", "drop-no")); });
board.addEventListener("dragover", e => {
  const st = e.target.closest(".stage"); if (!st || !dragId) return;
  const ok = canMove(card(dragId).stage, st.dataset.stage);
  board.querySelectorAll(".drop-ok,.drop-no").forEach(n => { if (n !== st) n.classList.remove("drop-ok", "drop-no"); });
  st.classList.toggle("drop-ok", ok); st.classList.toggle("drop-no", !ok);
  e.preventDefault(); e.dataTransfer.dropEffect = ok ? "move" : "none";
});
board.addEventListener("drop", e => {
  const st = e.target.closest(".stage"); if (!st || !dragId) return;
  e.preventDefault();
  if (!canMove(card(dragId).stage, st.dataset.stage)) toast(`Only Jay can move a card into or past ${B.gate}.`, true); else move(dragId, st.dataset.stage);
});
document.querySelector(".filters").addEventListener("click", e => {
  const b = e.target.closest("[data-filter]"); if (!b) return;
  B.filter = b.dataset.filter; document.querySelectorAll("[data-filter]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); render();
});

/* ---- new opportunity ---- */
const newDlg = $("#new"), newForm = $("#new-form");
$("#new-btn").addEventListener("click", () => { newForm.reset(); newDlg.showModal(); });
$("#new-close").addEventListener("click", () => newDlg.close());
newDlg.addEventListener("click", e => { if (e.target === newDlg) newDlg.close(); });
newForm.addEventListener("submit", async e => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(newForm));
  try { const { card: c } = await api("/cards", "POST", body); newDlg.close(); toast(`${c.id} added to Sourced`); await load(true); }
  catch (err) { toast(err.message, true); }
});

load();
setInterval(() => { if (!document.hidden && !dragId) load(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
